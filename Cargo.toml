[package]
name = "heptaseg"
version = "0.2.0"
edition = "2021"

authors = ["Heptaseg Contributors"]
description = "A vintage 7-segment LCD pocket calculator built with Rust and Slint"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vikman90/heptaseg"
keywords = ["calculator", "slint", "retro", "lcd", "fsm"]

categories = ["gui"]

[dependencies]
slint = "1.17"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }


[dev-dependencies]
proptest = "1.6"

[build-dependencies]
slint-build = "1.17"

