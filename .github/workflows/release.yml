name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libx11-xcb-dev libwayland-dev libasound2-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/heptaseg staging/
          cp target/${{ matrix.target }}/release/cli staging/heptaseg-cli
          cp README.md LICENSE staging/
          tar -czvf "heptaseg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C staging .

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/heptaseg.exe staging/
          cp target/${{ matrix.target }}/release/cli.exe staging/heptaseg-cli.exe
          cp README.md LICENSE staging/
          cd staging && 7z a "../heptaseg-${{ github.ref_name }}-${{ matrix.target }}.zip" *

      - name: Package release archive (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/heptaseg staging/
          cp target/${{ matrix.target }}/release/cli staging/heptaseg-cli
          cp README.md LICENSE staging/
          cd staging && zip -r "../heptaseg-${{ github.ref_name }}-${{ matrix.target }}.zip" .

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: heptaseg-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
