name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: zip
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libx11-xcb-dev libwayland-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="heptaseg-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$ARCHIVE_NAME"
          cp "target/${{ matrix.target }}/release/heptaseg" "$ARCHIVE_NAME/"
          cp "target/${{ matrix.target }}/release/cli" "$ARCHIVE_NAME/heptaseg-cli"
          cp README.md LICENSE "$ARCHIVE_NAME/"
          
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            zip -r "${ARCHIVE_NAME}.zip" "$ARCHIVE_NAME"
            shasum -a 256 "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "heptaseg-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE_NAME
          Copy-Item "target/${{ matrix.target }}/release/heptaseg.exe" -Destination "$ARCHIVE_NAME/"
          Copy-Item "target/${{ matrix.target }}/release/cli.exe" -Destination "$ARCHIVE_NAME/heptaseg-cli.exe"
          Copy-Item README.md, LICENSE -Destination "$ARCHIVE_NAME/"
          Compress-Archive -Path "$ARCHIVE_NAME/*" -DestinationPath "${ARCHIVE_NAME}.zip"
          (Get-FileHash -Algorithm SHA256 "${ARCHIVE_NAME}.zip").Hash | Out-File -FilePath "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heptaseg-${{ github.ref_name }}-${{ matrix.target }}.*
